<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Khoa Học D10 - Xin Chào</title>
  <!-- Nhúng Tailwind CSS để có giao diện đẹp ngay lập tức -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

  <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-700 max-w-md w-full text-center space-y-6">
    <div class="inline-block p-4 bg-indigo-500/10 rounded-full text-indigo-400 text-4xl">
      👋
    </div>
    
    <h1 class="text-3xl font-bold tracking-tight">
      Chào Mừng Đến Với <br />
      <span class="text-indigo-400">Khoa Học D10</span>
    </h1>
    
    <p class="text-slate-400 text-sm">
      Hệ thống đã triển khai thành công trên Cloudflare Pages!
    </p>

    <!-- Ô nhập tên để chào tương tác -->
    <div class="space-y-3">
      <input 
        id="nameInput" 
        type="text" 
        placeholder="Nhập tên của bạn..." 
        class="w-full px-4 py-3 rounded-lg bg-slate-700/60 border border-slate-600 focus:outline-none focus:border-indigo-400 text-white placeholder-slate-400 transition"
      />
      <button 
        onclick="sayHello()" 
        class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-semibold rounded-lg shadow-md transition transform active:scale-95"
      >
        Gửi lời chào
      </button>
    </div>

    <!-- Nơi hiển thị kết quả chào -->
    <div id="greetingMessage" class="hidden p-4 rounded-lg bg-indigo-950/60 border border-indigo-500/30 text-indigo-200 text-base font-medium"></div>
  </div>

  <script>
    function sayHello() {
      const input = document.getElementById('nameInput');
      const messageDiv = document.getElementById('greetingMessage');
      const name = input.value.trim();

      if (name) {
        messageDiv.innerHTML = `🎉 Xin chào <b>${name}</b>! Chúc bạn một ngày học tập và làm việc thật hiệu quả!`;
      } else {
        messageDiv.innerHTML = `👋 Xin chào bạn! Rất vui được gặp bạn tại Khoa Học D10.`;
      }
      
      messageDiv.classList.remove('hidden');
    }

    // Nhấn phím Enter để gửi luôn
    document.getElementById('nameInput').addEventListener('keyup', function(event) {
      if (event.key === 'Enter') {
        sayHello();
      }
    });
  </script>

</body>
</html>
